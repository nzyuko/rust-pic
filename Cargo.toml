[package]
name = "pic-example"
version = "0.1.0"
edition = "2021"
description = "Rust PIC (Position-Independent Code) shellcode example using dinvk"
license = "MIT"

[features]
default = []
pic = []

[dependencies]
dinvk = { git = "https://github.com/joaoviictorti/dinvk.git", features = ["alloc"] }

[[bin]]
name = "pic_example"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
